name: Catalog compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test catalog validator
        run: python -B -m unittest discover -s tests -p test_catalog.py -v
      - name: Check catalog policy
        run: python -B tools/check_catalog.py
      - name: Preserve existing Claude hub checks
        if: runner.os == 'Linux' && hashFiles('tests/validate_marketplace.sh') != ''
        shell: bash
        run: bash tests/validate_marketplace.sh
      - name: Install official host CLIs
        run: npm install --global @anthropic-ai/claude-code@latest @openai/codex@latest
      - name: Evaluate remote Git installs and native plugin loading
        run: python -B tools/check_catalog.py --smoke --report catalog-report.json
      - name: Preserve exact-revision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-${{ matrix.os }}
          path: catalog-report.json
          if-no-files-found: warn
